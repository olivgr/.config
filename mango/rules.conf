# Eizo
monitor_rule=name:HDMI-A-1,scale:1.0,refresh=60

# 4K
#monitor_rule=name:HDMI-A-1,scale:2.5,refresh=120

# tag_rules
# default layout style: fair
tag_rule=id:*,layout_name:fair

# window rules
#window_rule=unfocused_opacity:0.8,focused_opacity:1.0,app_id:com.mitchellh.ghostty
window_rule=is_floating:1,allow_csd:1,app_id:com.mitchellh.ghostty

# Open all new windows floating
#window_rule=is_floating:1,app_id:.*

# Named scratchpads
# Xclock scratchpad
window_rule=is_named_scratchpad:1,is_floating:1,is_overlay:1,no_border:1,title:xclock

# Neovim notes scratchpad
window_rule=is_named_scratchpad:1,is_floating:1,is_overlay:1,app_id:com.oliver.nvimnotes 

# wine in desktop mode
window_rule=is_floating:1,no_animation:1,app_id:explorer.exe
window_rule=width:1024,height:768,app_id:explorer.exe

# vasp
window_rule=is_floating:1,app_id:vasp64.exe
window_rule=no_animation:1,app_id:vasp64.exe
window_rule=force_tearing:1,app_id:vasp64.exe
window_rule=activation_bypass:1,app_id:^(vasp64\.exe)$
window_rule=is_fullscreen:1,app_id:vasp64.exe
window_rule=is_overlay:1,app_id:vasp64.exe

# amp
window_rule=is_floating:1,app_id:amp64.exe
window_rule=no_animation:1,app_id:amp64.exe
window_rule=force_tearing:1,app_id:amp64.exe
window_rule=activation_bypass:1,app_id:^(amp64\.exe)$
window_rule=is_fullscreen:1,app_id:amp64.exe
window_rule=is_overlay:1,app_id:amp64.exe

# notepad.exe, reaper.exe, vlc.exe
window_rule=is_floating:1,is_overlay:1,app_id:notepad.exe
window_rule=is_floating:1,is_overlay:1,app_id:reaper.exe
window_rule=is_floating:1,no_radius:1,is_overlay:1,app_id:vlc.exe
window_rule=width:300,height:74,offset_y:80,app_id:vlc.exe

# REAPER
window_rule=no_animation:1,is_overlay:0,app_id:REAPER
window_rule=no_animation:1,is_overlay:1,app_id:REAPER,title:^(VST|VSTi|JS)
#window_rule=no_animation:1,is_overlay:1,app_id:REAPER,title:^(Mixer|Media)
