source= ./rules.conf
source= ./binds.conf
source= ./autostart.conf

# keyboard
repeat_rate=24
repeat_delay=360
xkb_rules_options=ctrl:nocaps
xkb_rules_layout=jp

# appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=5
gap_outer_vertical=5
border_px=2
#border_radius=16
no_border_when_single=1
no_radius_when_single=0
cursor_size=20

#mouse_accel_profile=1
#mouse_accel_speed=-0.5
mouse_natural_scrolling=1
mouse_accel_profile=2
mouse_accel_speed=-0.9


# layout
circle_layout=fair,scroller,center_tile
# dwindle layout
dwindle_horizontal_split=1 # new windows go to the right side
dwindle_smart_split=0 # new windows go to the bottom
dwindle_split_ratio=0.5

# scroller
scroller_default_proportion=1
scroller_structs=5
scroller_prefer_center=1

# overview setting
enable_hotarea=1
hotarea_size=10
hotarea_corner=0
overview_gap_inner=5
overview_gap_outer=70

smart_gaps=0 # no gaps if the only window
xwayland_persistence=1
focus_on_activate=1
focus_cross_tag=0 # focus on window across tags
cursor_hide_on_keypress=1
animation_type_close=none
