var=term,ghostty
var=editor,nvim
var=browser,firefox
var=explorer,nautilus

# binds
bind=SUPER,Return,spawn,$term
bind=SUPER+shift,Return,spawn,$browser
bind=SUPER,e,spawn,$explorer
bind=SUPER,y,spawn,pw-jack reaper
bind=SUPER,u,spawn,pavucontrol

bind=SUPER,c,toggle_named_scratchpad,none,xclock,xclock -proportional -norender -bg grey20 -fg white -hands white -highlight white -update 1 -geometry 200x200-10+40 -title xclock
#bind=SUPER,c,toggle_named_scratchpad,none,xclock,xclock -digital -strftime "%H:%M" -bg gray20 -fg gray90 -face "JetBrains Mono:size=24" -padding 12 -geometry 114x60-10+40 -title xclock
bind=SUPER,n,toggle_named_scratchpad,com.oliver.nvimnotes,none,ghostty --class=com.oliver.nvimnotes --working-directory=/home/oliver/Notes -e nvim -c 'startinsert' /home/oliver/Notes/scratch.md

bind=SUPER,w,killclient,
bind=SUPER,f,togglefullscreen
bind=SUPER,o,togglejump
bind=SUPER+SHIFT,o,toggleoverview,1
bind=SUPER,g,toggleglobal
bind=SUPER,v,togglefloating
bind=SUPER,m,togglemaximizescreen
bind=SUPER,i,minimized
bind=SUPER,s,toggle_scratchpad
bind=SUPER+SHIFT,i,restore_minimized
bind=SUPER+SHIFT,v,toggle_all_floating
bind=SUPER,Space,spawn,fuzzel
bind=SUPER,F10,spawn,~/nixos/scripts/toggle-colorscheme.sh
bind=NONE,Print,spawn_shell,grim $HOME/Pictures/Screenshots/$(date +%Y%m%d%H%M%S).png
bind=SHIFT,Print,spawn_shell,g=$(slurp -d) && [ -n "$g" ] && grim -g "$g" $HOME/Pictures/Screenshots/$(date +%Y%m%d%H%M%S).png
bind=SUPER,Print,spawn_shell,f=$HOME/Pictures/Screenshots/$(date +%Y%m%d%H%M%S).png && grim "$f" && satty --filename "$f" --output-filename "$f" --actions-on-enter save-to-file --early-exit
bind=SUPER,Escape,spawn_shell, qs -c power ipc call -- power show
bind=SUPER,T,spawn,qs ipc --config bar call bar toggle
bind=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%- && qs -c volume ipc call -- volume show
bind=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+ && qs -c volume ipc call -- volume show
bind=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && qs -c volume ipc call -- volume show

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0

bind=SUPER+SHIFT,1,toggletag,1,0
bind=SUPER+SHIFT,2,toggletag,2,0
bind=SUPER+SHIFT,3,toggletag,3,0
bind=SUPER+SHIFT,4,toggletag,4,0
bind=SUPER+SHIFT,5,toggletag,5,0

# binds - layout
bind=SUPER,q,switch_layout
bind=SUPER,Tab,switcher,next
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up

bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# mouse bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
